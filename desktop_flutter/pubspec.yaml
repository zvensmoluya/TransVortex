name: transvortex_desktop_flutter
description: TransVortex Flutter desktop app for native-feeling subtitle workflows.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Desktop dependencies: multi-window lifecycle/state, frameless fixed windows,
  # OS drag-drop, and the system file dialog.
  desktop_multi_window: ^0.3.0
  window_manager: ^0.4.0
  screen_retriever: ^0.2.1
  desktop_drop: ^0.5.0
  file_picker: ^8.0.0
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: TransVortexNotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 700

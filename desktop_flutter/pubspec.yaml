name: transvortex_desktop_flutter
description: TransVortex Flutter desktop spike for validating native-feeling desktop workflows.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Phase A spike dependencies: multi-window lifecycle/state, frameless fixed
  # windows, OS drag-drop, and the system file dialog.
  desktop_multi_window: ^0.3.0
  window_manager: ^0.4.0
  desktop_drop: ^0.5.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

artifacts_dir: artifacts
translation_batch_size: 120
default_concurrency: 8
timeout_seconds: 30
retry: 3
max_cps: 20
prompts:
  translation_system: prompts/translation/system.v1.md
  translation_style: prompts/translation/style.zh-CN.v1.md
  memory_bootstrap_system: prompts/memory/bootstrap_system.v1.md
  memory_patch_system: prompts/memory/patch_system.v1.md
subtitle:
  quality:
    enabled: true
    mode: balanced
    target_cps: 17
    hard_max_cps: 22
    max_line_width: 42
    max_lines: 2
    min_duration_seconds: 0.8
    max_duration_seconds: 6.0
    min_gap_seconds: 0.04
    merge_short_segments: true
    adjust_timing: true
  compression:
    enabled: false
    max_attempts: 1
translation:
  chunk_lines: 120
  context_before_lines: 80
  context_after_lines: 40
  chunking:
    mode: capacity_aware
    min_chunk_lines: 120
    target_chunk_lines: 400
    max_chunk_lines: 900
    boundary_window_lines: 80
    soft_boundary: true
    target_output_tokens: 0
    hard_output_tokens: 0
  batching:
    mode: adaptive
    min_chunk_lines: 20
    grow_after_successes: 3
  style_preset: subtitle_natural
  refusal_detection:
    enabled: true
  repair:
    enabled: true
    max_attempts: 2
memory:
  enabled: true
  mode: bootstrap_first
  bootstrap:
    enabled: true
    mode: whole_document
    max_candidates: 120
  chunking:
    min_initial_chunk_lines: 80
    max_initial_chunks: 24
  inject:
    locked: true
    confirmed: true
    proposed: true
    strategy: balanced
    max_entries_per_chunk: 30
  patch:
    enabled: false
    after_each_window: false
    window_chunks: 8
  merge:
    auto_confirm_high_confidence: false
    conflict_policy: record
  consistency_check:
    enabled: true
asr:
  mode: local
  provider: openai_whisper
  local:
    model_size: small
    device: auto
    compute_type: int8
    max_initial_timestamp: 30.0
  prompt:
    enabled: true
    text: ""
    include_previous_text: false
    max_chars: 800
  preprocessing:
    cloud_trim_silence:
      enabled: true
      backend: ffmpeg_silencedetect
      noise_db: -35
      min_silence_seconds: 0.2
      keep_preroll_seconds: 0.25
      trim_trailing: true
      keep_postroll_seconds: 0.1
      min_upload_seconds: 0.5
  execution:
    cloud_concurrency: 8
    adaptive_concurrency: true
    min_cloud_concurrency: 1
    max_cloud_concurrency: 8
    max_inflight_upload_mb: 128
  chunking:
    mode: silence
    window_seconds: 300
    max_window_seconds: 120
    min_window_seconds: 12
    overlap_seconds: 5
    short_audio_seconds: 300
    max_upload_mb: 24
    silence:
      noise_db: -35
      min_silence_seconds: 0.25
      cut_padding_seconds: 0.15
      fallback_mode: hard_cut
    fuzzy_dedupe: true
asr_providers:
  - name: openai_whisper
    protocol: openai_transcriptions
    base_url: https://api.vectorengine.ai/v1
    endpoint: /v1/audio/transcriptions
    model: whisper-1
    env_key: TVX_MODEL_API_KEY
    credential_id: TVX_MODEL_API_KEY
    timeout_seconds: 300
    retry: 2
    request:
      response_format: verbose_json
      temperature: 0
      timestamp_granularities: [segment]
      include: []
      array_format: brackets
      extra_form_fields: {}

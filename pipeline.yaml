artifacts_dir: artifacts
translation_batch_size: 120
default_concurrency: 8
timeout_seconds: 30
retry: 3
max_cps: 20
prompts:
  translation_system: prompts/translation/system.v1.md
  translation_style: prompts/translation/style.zh-CN.v1.md
  memory_bootstrap_system: prompts/memory/bootstrap_system.v1.md
  memory_patch_system: prompts/memory/patch_system.v1.md
subtitle:
  quality:
    enabled: true
    mode: balanced
    target_cps: 17
    hard_max_cps: 22
    max_line_width: 42
    max_lines: 2
    min_duration_seconds: 0.8
    max_duration_seconds: 6.0
    min_gap_seconds: 0.04
    merge_short_segments: false
    adjust_timing: true
  compression:
    enabled: false
    max_attempts: 1
subtitle_ass_style:
  preset: cinematic
  play_res_x: 1920
  play_res_y: 1080
  font_name: Noto Sans SC
  font_fallbacks:
    - Microsoft YaHei
    - Microsoft YaHei UI
    - Source Han Sans SC
    - PingFang SC
    - Hiragino Sans GB
    - Yu Gothic
    - Arial Unicode MS
    - sans-serif
  font_size: 39
  primary_color: "&H00F6F1EA"
  outline_color: "&H8A000000"
  back_color: "&H82000000"
  outline: 1.35
  shadow: 0.18
  margin_l: 120
  margin_r: 120
  margin_v: 76
  safe_margin_x: 96
  safe_margin_y: 54
  bilingual_order: target_source
  target_max_width: 48
  source_max_width: 58
  hard_max_width: 64
  prefer_single_line: true
  max_target_lines: 2
  max_source_lines: 2
  bilingual_gap: 12
  line_spacing: 1.08
  source_font_name: Yu Gothic
  source_font_size: 25
  source_primary_color: "&H00D2CBC2"
  source_outline_color: "&H96000000"
  source_back_color: "&H84000000"
  source_outline: 1.05
  source_shadow: 0.14
  source_margin_v: 128
translation:
  chunk_lines: 120
  context_before_lines: 80
  context_after_lines: 40
  chunking:
    mode: capacity_aware
    min_chunk_lines: 120
    target_chunk_lines: 400
    max_chunk_lines: 900
    boundary_window_lines: 80
    soft_boundary: true
    target_output_tokens: 0
    hard_output_tokens: 0
    input_safety_ratio: 0.85
    prompt_overhead_tokens: 1200
  batching:
    mode: adaptive
    min_chunk_lines: 20
  experiment_logging:
    enabled: false
    save_raw_text: true
    save_metrics: true
    label: ""
  style_preset: subtitle_natural
  refusal_detection:
    enabled: true
  repair:
    enabled: true
    max_attempts: 2
memory:
  enabled: true
  bootstrap:
    enabled: true
    mode: whole_document
    max_candidates: 120
  chunking:
    min_initial_chunk_lines: 80
    max_initial_chunks: 24
  inject:
    enabled: true
    locked: true
    confirmed: true
    proposed: true
    intensity: high
    max_prompt_tokens: 2400
    max_notes_chars_per_entry: 60
  patch:
    enabled: false
    mode: serial
    window_chunks: 3
  merge:
    auto_confirm_high_confidence: false
    conflict_policy: record
  consistency_check:
    enabled: true
asr:
  provider: faster_whisper_large_v3
  audio_track: auto
  prompt:
    enabled: true
    active_profile: ""
    profiles: []
    include_previous_text: false
    max_chars: 800
asr_providers:
  - name: faster_whisper_large_v3
    kind: local_inprocess
    protocol: faster_whisper
    model: large-v3
    local:
      device: cuda
      compute_type: int8_float16
      max_initial_timestamp: 30.0
      beam_size: 5
      temperature: 0.0
      condition_on_previous_text: false
      hotwords: ""
    execution:
      concurrency: 1
      timeout_seconds: 300
      retry: 1
    chunking:
      mode: silence
      window_seconds: 300
      max_window_seconds: 120
      min_window_seconds: 12
      overlap_seconds: 5
      short_audio_seconds: 300
      max_upload_mb: 24
      silence:
        noise_db: -35
        min_silence_seconds: 0.25
        cut_padding_seconds: 0.15
        fallback_mode: hard_cut
      fuzzy_dedupe: true
    preprocessing:
      trim_silence:
        enabled: false
  - name: funasr_sensevoice_local
    kind: local_server
    protocol: funasr_openai
    base_url: http://127.0.0.1:8899
    endpoint: /v1/audio/transcriptions
    model: sensevoice
    auth:
      type: none
    http2: false
    request:
      response_format: verbose_json
      send_temperature: false
      send_timestamp_granularities: false
      send_prompt: false
      array_format: repeat
    execution:
      concurrency: 1
      timeout_seconds: 300
      retry: 1
    chunking:
      mode: fixed
      window_seconds: 120
      max_window_seconds: 120
      min_window_seconds: 1
      overlap_seconds: 0
      short_audio_seconds: 120
      max_upload_mb: 64
      silence:
        noise_db: -35
        min_silence_seconds: 0.25
        cut_padding_seconds: 0.15
        fallback_mode: hard_cut
      fuzzy_dedupe: false
    preprocessing:
      trim_silence:
        enabled: false
  - name: openai_whisper_remote
    kind: remote
    protocol: openai_transcriptions
    base_url: https://api.vectorengine.ai/v1
    endpoint: /v1/audio/transcriptions
    model: whisper-1
    auth:
      type: bearer
      env_key: TVX_MODEL_API_KEY
      credential_id: TVX_MODEL_API_KEY
    execution:
      concurrency: 8
      adaptive_concurrency: true
      min_concurrency: 1
      max_concurrency: 8
      max_inflight_upload_mb: 128
      timeout_seconds: 300
      retry: 2
    preprocessing:
      trim_silence:
        enabled: true
        backend: ffmpeg_silencedetect
        noise_db: -35
        min_silence_seconds: 0.2
        keep_preroll_seconds: 0.25
        trim_trailing: true
        keep_postroll_seconds: 0.1
        min_upload_seconds: 0.5
    chunking:
      mode: silence
      window_seconds: 300
      max_window_seconds: 120
      min_window_seconds: 12
      overlap_seconds: 5
      short_audio_seconds: 300
      max_upload_mb: 24
      silence:
        noise_db: -35
        min_silence_seconds: 0.25
        cut_padding_seconds: 0.15
        fallback_mode: hard_cut
      fuzzy_dedupe: true
    http2: true
    request:
      response_format: verbose_json
      temperature: 0
      timestamp_granularities: [segment]
      include: []
      array_format: brackets
      extra_form_fields: {}

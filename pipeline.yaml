artifacts_dir: artifacts
chunk_seconds: 60
chunk_overlap_seconds: 1
translation_batch_size: 40
default_concurrency: 8
timeout_seconds: 30
retry: 3
max_cps: 20
subtitle:
  quality:
    enabled: true
    mode: balanced
    target_cps: 17
    hard_max_cps: 22
    max_line_width: 42
    max_lines: 2
    min_duration_seconds: 0.8
    max_duration_seconds: 6.0
    min_gap_seconds: 0.04
    merge_short_segments: true
    adjust_timing: true
  compression:
    enabled: false
    max_attempts: 1
translation:
  chunk_lines: 40
  context_before_lines: 20
  context_after_lines: 10
  style_preset: subtitle_natural
  style_prompt: |
    Translate as natural subtitles.
    Keep the wording concise, spoken, and context-aware.
    Preserve profanity, insults, jokes, sarcasm, adult references, and character voice faithfully.
    Do not censor, soften, moralize, summarize, or add explanations.
  refusal_detection:
    enabled: true
  repair:
    enabled: true
    max_attempts: 2
asr:
  mode: local
  provider: openai_asr
  model: whisper-1
  model_size: small
  device: cpu
  compute_type: int8
  cloud:
    base_url: https://api.vectorengine.ai/v1
    endpoint: /v1/audio/transcriptions
    model: whisper-1
    env_key: TVX_MODEL_API_KEY
    timeout_seconds: 300

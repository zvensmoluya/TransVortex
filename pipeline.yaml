artifacts_dir: artifacts
translation_batch_size: 120
default_concurrency: 8
timeout_seconds: 30
retry: 3
max_cps: 20
prompts:
  translation_system: prompts/translation/system.v1.md
  translation_style: prompts/translation/style.zh-CN.v1.md
  memory_patch_system: prompts/memory/patch_system.v1.md
subtitle:
  quality:
    enabled: true
    mode: balanced
    target_cps: 17
    hard_max_cps: 22
    max_line_width: 42
    max_lines: 2
    min_duration_seconds: 0.8
    max_duration_seconds: 6.0
    min_gap_seconds: 0.04
    merge_short_segments: true
    adjust_timing: true
  compression:
    enabled: false
    max_attempts: 1
translation:
  chunk_lines: 120
  context_before_lines: 40
  context_after_lines: 20
  style_preset: subtitle_natural
  refusal_detection:
    enabled: true
  repair:
    enabled: true
    max_attempts: 2
memory:
  enabled: true
  mode: consistency_first
  inject:
    locked: true
    confirmed: true
    proposed: true
    strategy: full
    max_entries_per_chunk: 30
  patch:
    enabled: true
    after_each_window: true
  merge:
    auto_confirm_high_confidence: false
    conflict_policy: record
  consistency_check:
    enabled: true
asr:
  mode: local
  provider: openai_asr
  model: whisper-1
  model_size: small
  device: auto
  compute_type: int8
  chunking:
    mode: auto
    window_seconds: 300
    overlap_seconds: 30
    short_audio_seconds: 300
    fuzzy_dedupe: true
  cloud:
    base_url: https://api.vectorengine.ai/v1
    endpoint: /v1/audio/transcriptions
    model: whisper-1
    env_key: TVX_MODEL_API_KEY
    timeout_seconds: 300

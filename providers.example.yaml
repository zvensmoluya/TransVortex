providers:
  - name: vector_anthropic
    api_type: anthropic
    compat_mode: anthropic_messages
    base_url: https://api.vectorengine.ai/v1
    env_key: TVX_MODEL_API_KEY
    models:
      - claude-haiku-4-5-20251001
    auth:
      type: header
      header_name: x-api-key
      prefix: ""
    endpoint:
      path_template: /v1/messages
      method: POST
    request_mapping:
      style: anthropic_messages
      max_tokens: 4096
      # Optional advanced compatibility fields.
      # body_overrides is deep-merged into the generated provider payload.
      # body_remove_paths deletes generated fields before sending.
      # query_params appends non-auth query parameters to the request URL.
      body_overrides: {}
      body_remove_paths: []
      query_params: {}
    response_mapping:
      text_paths:
        - content[].text
    capabilities:
      supports_system_prompt: true
      supports_temperature: true
      supports_json_mode: false
      max_batch_lines: 200
    limits:
      concurrency: 8
      timeout_seconds: 180
      retry: 3
      connect_timeout_seconds: 10
      read_timeout_seconds: 180
      write_timeout_seconds: 60
      pool_timeout_seconds: 5
      max_connections: 20
      max_keepalive_connections: 10
      http2: true
      streaming_enabled: true

routing:
  primary:
    provider: vector_anthropic
    model: claude-haiku-4-5-20251001
  fallback: []


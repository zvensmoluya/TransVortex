providers:
  - name: example_anthropic_gateway
    api_type: anthropic
    compat_mode: anthropic_messages
    base_url: https://gateway.example.invalid/v1
    env_key: TVX_EXAMPLE_PROVIDER_API_KEY
    models:
      - example-model
    auth:
      type: header
      header_name: x-api-key
      prefix: ""
    endpoint:
      path_template: /messages
      method: POST
    request_mapping:
      style: anthropic_messages
      # Optional advanced compatibility fields.
      # body_overrides is deep-merged into the generated provider payload.
      # body_remove_paths deletes generated fields before sending.
      # query_params appends non-auth query parameters to the request URL.
      body_overrides: {}
      body_remove_paths: []
      query_params: {}
    response_mapping:
      text_paths:
        - content[].text
    capabilities:
      supports_system_prompt: true
      supports_temperature: true
      supports_json_mode: false
      max_batch_lines: 1000
      # max_context_tokens is used by translation chunk planning to reserve
      # enough input window for prompts, memory, context, and source lines.
      max_context_tokens: 0
      # max_output_tokens is sent to the provider when supported; recommended_output_tokens
      # is a softer planning target for normal chunk size.
      max_output_tokens: 32768
      recommended_output_tokens: 16384
      output_token_param: ""
    limits:
      concurrency: 8
      timeout_seconds: 180
      retry: 3
      connect_timeout_seconds: 10
      read_timeout_seconds: 180
      write_timeout_seconds: 60
      pool_timeout_seconds: 5
      max_connections: 20
      max_keepalive_connections: 10
      http2: true
      streaming_enabled: true

routing:
  primary:
    provider: example_anthropic_gateway
    model: example-model
  fallback: []


providers:
  - name: zven_openai_responses
    api_type: openai-compatible
    compat_mode: openai_responses
    base_url: https://ai.zven.cc/v1
    env_key: TVX_MODEL_API_KEY
    credential_id: zven_openai_responses
    models:
      - gpt-5.5
    auth:
      type: bearer
      header_name: Authorization
      prefix: "Bearer "
    endpoint:
      path_template: /responses
      method: POST
    request_mapping:
      style: openai_responses
      body_overrides:
        reasoning:
          effort: high
    response_mapping:
      text_paths:
        - output_text
        - output[].content[].text
    capabilities:
      supports_system_prompt: true
      supports_temperature: true
      supports_json_mode: false
      max_batch_lines: 50
    limits:
      concurrency: 8
      timeout_seconds: 30
      retry: 3

routing:
  primary:
    provider: zven_openai_responses
    model: gpt-5.5
  fallback: []
